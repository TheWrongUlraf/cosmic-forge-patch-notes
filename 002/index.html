<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Cosmic Forge - You found tomorrow</title>
  <link rel="stylesheet" href="../assets/sky.css">
  <style>
    :root{color-scheme:dark;--bg:#080e1d;--ink:#f3f0e8;--muted:#aeb9cc;--gold:#edca86}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;isolation:isolate}
    main{width:min(100%,560px);text-align:center}
    .eyebrow{margin:0 0 25px;color:var(--gold);font-size:10px;letter-spacing:.22em;line-height:1.8;text-transform:uppercase}
    .star{width:128px;height:128px;margin:0 auto 30px;background:radial-gradient(circle,#edca8612,transparent 68%)}
    .star svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px #edca8666);animation:twinkle 4.5s ease-in-out infinite}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(35px,5vw,52px);font-weight:400;letter-spacing:-.04em;line-height:1.15}
    .dream{margin:17px 0 0;color:var(--muted);font-size:15px;line-height:1.8}
    @keyframes twinkle{0%,100%{opacity:.7;transform:scale(.95)}50%{opacity:1;transform:scale(1.04)}}
    @media(prefers-reduced-motion:reduce){.star svg{animation:none}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">002 &nbsp; / &nbsp; You found tomorrow</p>
    <div class="star" aria-hidden="true">
      <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="starlight">
            <stop offset="0" stop-color="#fffcef"/>
            <stop offset=".3" stop-color="#ffe6ac"/>
            <stop offset="1" stop-color="#c89848"/>
          </radialGradient>
        </defs>
        <path fill="url(#starlight)" d="M60 14 L65 53 L94 60 L65 66 L60 106 L54 67 L26 60 L54 53 Z"/>
      </svg>
    </div>
    <h1>You&rsquo;re a little early.</h1>
    <p class="dream">The next chapter is still dreaming.</p>
  </main>
</body>
</html>
